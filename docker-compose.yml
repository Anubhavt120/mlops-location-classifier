version: '3.8'

services:
  location-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: location-classifier:latest
    container_name: location_image_classifier
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
